name: Apply and verify tracker reliability fixes
on:
  push:
    branches: [fix/tracker-fresh-verified-offers]
    paths:
      - scripts/apply_reliability_fix.py
      - tests/test_reliability.py
      - .github/workflows/apply-reliability-fix.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply reviewed source changes
        run: |
          if [ -f scripts/apply_reliability_fix.py ]; then
            python scripts/apply_reliability_fix.py
            python -m compileall -q bot tracker sessions database utils filters config.py main.py tests/test_reliability.py
          else
            echo 'Waiting for the source patch commit; no application files changed.'
          fi
      - name: Install test dependencies
        if: hashFiles('scripts/apply_reliability_fix.py') != ''
        run: python -m pip install -r requirements.txt
      - name: Offline regression tests
        if: hashFiles('scripts/apply_reliability_fix.py') != ''
        env:
          PYTHONPATH: .
        run: |
          if [ -f .env ]; then mv .env /tmp/tracker-production-env; fi
          trap 'if [ -f /tmp/tracker-production-env ]; then mv /tmp/tracker-production-env .env; fi' EXIT
          python -m unittest tests.test_reliability -v
          for t in tests/test_config_validators.py tests/test_pipeline_stop.py tests/test_health_server.py tests/test_proxy.py; do
            timeout 90 python "$t"
          done
      - name: Commit verified changes on the fix branch
        if: hashFiles('scripts/apply_reliability_fix.py') != ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot tracker filters utils config.py main.py tests/test_reliability.py
          git diff --cached --quiet || git commit -m 'Fix stale lots, verified sellers, offer links and nonblocking bot failures'
          git push origin HEAD:fix/tracker-fresh-verified-offers
